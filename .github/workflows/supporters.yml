name: Supporter count

# Updates the supporter count in the README from Buy Me a Coffee.
#
# The token is a repository secret, mapped into one step's env and nowhere
# else. It is never interpolated into a `run:` body -- ${{ }} is substituted
# textually into a script on disk before the shell sees it, which is how
# secrets end up in process listings.
#
# The trigger is deliberately restricted to schedule and manual dispatch:
# pull_request_target, issue_comment and workflow_run all run with secrets
# available in contexts an outsider can influence.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

# No contents: write at workflow level -- the job holding the third-party
# token should not also be able to push. The pull-request action gets what it
# needs at job level below.
permissions: {}

jobs:
  count:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the supporter count
        id: count
        env:
          BMC_TOKEN: ${{ secrets.BMC_TOKEN }}
        run: python3 .github/scripts/build_supporters.py

      - name: Open a pull request if it changed
        if: steps.count.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update the supporter count"
          branch: supporter-count-update
          delete-branch: true
          title: "Supporter count: ${{ steps.count.outputs.total }}"
          body: |
            The number of people who've bought a coffee, read from Buy Me a Coffee.

            No names are read or published — only the count. Named credits stay
            hand-written, with the supporter's agreement, because Buy Me a Coffee's
            privacy flags are undocumented enough that publishing names automatically
            risks naming someone who chose to stay anonymous.
