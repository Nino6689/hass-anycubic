# Home Assistant Integration Quality Scale — self-assessment.
#
# This is a HACS custom integration, so it can't display an official quality
# badge (that mechanism is core-only). The rules are still the best available
# yardstick, so the integration is measured against them honestly here:
# "done" means genuinely met, "todo" means not yet, and exemptions say why.

rules:
  # ---------------------------------------------------------------- bronze --
  action-setup:
    status: done
    comment: >-
      Actions are registered in async_setup, so they exist even with no entry
      loaded; the handlers raise if the entry they need is unavailable.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow:
    status: done
    comment: >-
      Single-step setup: the user pastes any token and the auth mode is
      detected from its shape, with the alternatives tried as a fallback.
      Steps carry data_description text.
  config-flow-test-coverage:
    status: done
    comment: >-
      tests/test_config_flow.py covers the happy path, messy pastes, the
      auth-mode fallback, the Android device-id path, unrecoverable auth
      failure and empty input.
  dependency-transparency:
    status: done
    comment: >-
      The API client and the frontend panel are published packages
      (anycubic-cloud-api, anycubic-cloud-frontend) rather than vendored, and
      each declares its own dependencies.
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: done
    comment: Per-entry state lives on entry.runtime_data; hass.data is unused.
  test-before-configure: done
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: >-
      The Anycubic user id is the unique id, and adding the same account a
      second time aborts rather than creating a duplicate entry.

  # ---------------------------------------------------------------- silver --
  action-exceptions:
    status: done
    comment: >-
      Every action wraps its printer call, so a cloud failure surfaces as a
      Home Assistant error rather than a traceback.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >-
      An outage is logged once on the transition, not on every failed poll,
      and recovery is logged when the connection comes back.
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES = 0 on every platform (coordinator-driven).
  reauthentication-flow:
    status: done
    comment: Uses the same single-paste step as initial setup.
  test-coverage:
    status: done
    comment: >-
      95% overall across 298 tests. The printer fixture is a redacted capture
      from a real Kobra S1 + ACE Pro fed to the actual API client, so the
      tests run against the genuine payload shape rather than a mock.

  # ------------------------------------------------------------------ gold --
  devices:
    status: done
    comment: >-
      A device per printer, plus each ACE as its own device linked via
      via_device so a second unit has somewhere to live.
  diagnostics:
    status: done
    comment: Redacted diagnostics download, including tagged-value redaction.
  discovery:
    status: exempt
    comment: >-
      Printers are reached through Anycubic's cloud, not on the local
      network, so there is nothing to discover.
  discovery-update-info:
    status: exempt
    comment: Cloud integration; no local network information to update.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: done
    comment: >-
      Split into hardware verified first-hand versus models reported working
      by the community, rather than implying coverage that isn't tested.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: >-
      Printers selected on the entry but not yet loaded (added later, or
      offline at startup) are picked up on a later refresh instead of
      needing a restart.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: Diagnostic and noisy entities are categorised appropriately.
  entity-translations: done
  exception-translations:
    status: done
    comment: >-
      Raised errors carry translation keys rather than bare strings, so
      failures read as sentences in the user's own language.
  icon-translations:
    status: done
    comment: >-
      icons.json covers every entity; each key was validated against the
      real entity translation keys.
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: >-
      Warns 14 days before the Anycubic token expires. Tokens are 90-day
      JWTs that cannot be refreshed automatically, so advance notice is the
      only graceful option.
  stale-devices:
    status: done
    comment: >-
      Devices for printers no longer selected on the entry are removed on
      refresh; accessories go with their parent printer.

  # -------------------------------------------------------------- platinum --
  async-dependency: done
  inject-websession:
    status: done
    comment: The API client is constructed with Home Assistant's session.
  strict-typing:
    status: done
    comment: >-
      mypy --strict passes across the integration and runs in CI. Home
      Assistant's own modules are exempted from the re-export rule, since
      core does not declare __all__ everywhere.
