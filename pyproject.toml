[project]
name = "hass-anycubic-cloud"
version = "0.4.0"
description = "Anycubic Cloud integration for Home Assistant"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The integration lives at custom_components/, which is not an installed
# package; put the repo root on sys.path so tests can import it in CI too.
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 127
target-version = "py313"
# The bundled Anycubic API client is third-party code inherited from upstream
# and is slated for extraction into its own PyPI package; linting it here would
# create a large diff in code that is about to move. Integration code and tests
# are held to the full rule set.
extend-exclude = ["custom_components/anycubic_cloud/anycubic_cloud_api"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
# Home Assistant and the test harness are not fully typed; only this
# integration's own code is held to strict typing.
follow_imports = "silent"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = false

# Standalone developer utilities, not loaded by Home Assistant. They live
# at the repository root now rather than inside the component, so they are
# no longer shipped to everyone who installs it.
exclude = ["scripts/"]

# Home Assistant does not declare __all__ on every module, and strict mode
# turns off implicit re-export. The imports are correct and used throughout
# core itself, so relax the rule for its modules only.
[[tool.mypy.overrides]]
module = "homeassistant.*"
implicit_reexport = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
